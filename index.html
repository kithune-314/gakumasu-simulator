<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>学マスシミュ</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: sans-serif;

            margin: 0;

            padding: 20px;

            background: #f5f5f5;

        }


        /* =========================
           全体
        ========================= */

        .container {

            display: flex;

            gap: 30px;

            max-width: 1400px;

            margin: auto;

        }


        /* =========================
           左側
        ========================= */

        .main {

            flex: 1;

            min-width: 0;

        }


        /* =========================
           パラメータ
        ========================= */

        .parameter {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .parameter input {

            width: 100px;

            padding: 7px;

        }


        #turn {

            width: 100px;

            padding: 7px;

        }


        /* =========================
           登録先
        ========================= */

        .register-select {

            margin-bottom: 20px;

        }


        .register-select select {

            padding: 7px;

            font-size: 16px;

        }


        /* =========================
           カードエリア
        ========================= */

        .area {

            background: white;

            border: 1px solid #ccc;

            border-radius: 8px;

            padding: 10px;

            margin: 15px 0;

            min-height: 140px;

        }


        .area h4 {

            margin-top: 0;

            margin-bottom: 10px;

        }


        /* =========================
           登録済みカード
        ========================= */

        .registered-card {

            position: relative;

            display: inline-block;

            margin: 5px;

        }


        .registered-card img {

            width: 100px;

            display: block;

            border-radius: 5px;

        }


        .remove {

            position: absolute;

            top: -6px;

            right: -6px;

            width: 23px;

            height: 23px;

            border: none;

            border-radius: 50%;

            background: #e74c3c;

            color: white;

            font-size: 15px;

            cursor: pointer;

        }


        .remove:hover {

            background: #c0392b;

        }


        /* =========================
           右側
        ========================= */

        .card-sidebar {

            width: 320px;

            background: white;

            border-left: 1px solid #ccc;

            padding-left: 20px;

            position: sticky;

            top: 20px;

            align-self: flex-start;

        }


        /* =========================
           検索
        ========================= */

        #cardSearch {

            width: 100%;

            padding: 9px;

            font-size: 15px;

            border: 1px solid #aaa;

            border-radius: 5px;

            margin-bottom: 10px;

        }


        /* =========================
           タグ
        ========================= */

        .tag-title {

            font-size: 14px;

            font-weight: bold;

            margin-top: 10px;

            margin-bottom: 5px;

        }


        .tag-list {

            display: flex;

            flex-wrap: wrap;

            gap: 5px;

            margin-bottom: 10px;

        }


        .tag-button {

            border: 1px solid #bbb;

            background: #fff;

            border-radius: 15px;

            padding: 5px 10px;

            cursor: pointer;

            font-size: 13px;

        }


        .tag-button:hover {

            background: #eee;

        }


        .tag-button.selected {

            background: #3498db;

            color: white;

            border-color: #3498db;

        }


        /* =========================
           AND / OR
        ========================= */

        .filter-mode {

            display: flex;

            gap: 5px;

            margin-bottom: 10px;

        }


        .filter-mode button {

            flex: 1;

            padding: 6px;

            border: 1px solid #aaa;

            background: white;

            cursor: pointer;

            border-radius: 4px;

        }


        .filter-mode button.active {

            background: #555;

            color: white;

        }


        /* =========================
           件数
        ========================= */

        .card-count {

            font-size: 13px;

            color: #666;

            margin-bottom: 8px;

        }


        /* =========================
           カード一覧
        ========================= */

        .card-list {

            display: flex;

            flex-direction: column;

            gap: 8px;

            max-height: calc(100vh - 360px);

            overflow-y: auto;

            padding-right: 5px;

        }


        .card-item {

            cursor: pointer;

            border: 2px solid transparent;

            border-radius: 5px;

            transition: 0.1s;

        }


        .card-item:hover {

            border-color: #3498db;

            transform: scale(1.02);

        }


        .card-item img {

            width: 100%;

            display: block;

            border-radius: 4px;

        }


        .card-name {

            font-size: 13px;

            padding: 4px;

            text-align: center;

        }


        .no-result {

            text-align: center;

            color: #888;

            padding: 20px;

        }


        /* =========================
           スクロールバー
        ========================= */

        .card-list::-webkit-scrollbar {

            width: 7px;

        }


        .card-list::-webkit-scrollbar-thumb {

            background: #bbb;

            border-radius: 5px;

        }


        /* =========================
           スマホ
        ========================= */

        @media (max-width: 700px) {

            .container {

                flex-direction: column;

            }


            .card-sidebar {

                width: 100%;

                border-left: none;

                border-top: 1px solid #ccc;

                padding-left: 0;

                padding-top: 20px;

                position: static;

            }


            .card-list {

                display: grid;

                grid-template-columns: repeat(2, 1fr);

                max-height: none;

            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- =================================
         左側
    ================================== -->

    <main class="main">


        <h2>学マスシミュ</h2>


        <!-- パラメータ -->

        <h4>パラメーター</h4>

        <div class="parameter">

            <input
                type="number"
                id="Vo"
                placeholder="Vo %"
            >

            <input
                type="number"
                id="Da"
                placeholder="Da %"
            >

            <input
                type="number"
                id="Vi"
                placeholder="Vi %"
            >

        </div>


        <!-- ターン -->

        <h4>残りターン数</h4>

        <input
            type="number"
            id="turn"
        >


        <!-- スキルカード -->

        <h4>スキルカード</h4>


        <div class="register-select">

            <label>
                登録先：
            </label>


            <select id="registerArea">

                <option value="hand">
                    手札
                </option>

                <option value="deck">
                    山札
                </option>

                <option value="discard">
                    捨て札
                </option>

                <option value="exclude">
                    除外
                </option>

            </select>

        </div>


        <!-- 手札 -->

        <div class="area">

            <h4>手札</h4>

            <div id="hand"></div>

        </div>


        <!-- 山札 -->

        <div class="area">

            <h4>山札</h4>

            <div id="deck"></div>

        </div>


        <!-- 捨て札 -->

        <div class="area">

            <h4>捨て札</h4>

            <div id="discard"></div>

        </div>


        <!-- 除外 -->

        <div class="area">

            <h4>除外</h4>

            <div id="exclude"></div>

        </div>


    </main>



    <!-- =================================
         右側
    ================================== -->

    <aside class="card-sidebar">


        <h3>カード一覧</h3>


        <!-- 検索 -->

        <input
            type="text"
            id="cardSearch"
            placeholder="カード名を検索..."
        >


        <!-- タグ -->

        <div class="tag-title">
            タグ
        </div>


        <div
            id="tagList"
            class="tag-list"
        ></div>


        <!-- AND / OR -->

        <div class="filter-mode">

            <button
                id="andButton"
                class="active"
            >
                AND
            </button>

            <button
                id="orButton"
            >
                OR
            </button>

        </div>


        <!-- 件数 -->

        <div
            id="cardCount"
            class="card-count"
        ></div>


        <!-- カード一覧 -->

        <div
            id="cardList"
            class="card-list"
        ></div>


    </aside>


</div>



<!-- カードデータ -->

<script src="cards.js"></script>



<script>


    /* =================================
       登録済みカード
    ================================== */

    const cardData = {

        hand: [],

        deck: [],

        discard: [],

        exclude: []

    };


    /* =================================
       選択中タグ
    ================================== */

    let selectedTags = [];


    /* =================================
       AND / OR
    ================================== */

    let filterMode = "AND";


    /* =================================
       タグ一覧を作る
    ================================== */

    function createTagList() {

        const container =
            document.getElementById("tagList");


        container.innerHTML = "";


        tags.forEach(tag => {

            const button =
                document.createElement("button");


            button.className =
                "tag-button";


            button.textContent =
                tag;


            button.addEventListener(
                "click",
                () => {

                    toggleTag(tag, button);

                }
            );


            container.appendChild(button);

        });

    }


    /* =================================
       タグ選択
    ================================== */

    function toggleTag(tag, button) {


        const index =
            selectedTags.indexOf(tag);


        if (index === -1) {

            selectedTags.push(tag);

            button.classList.add("selected");

        }
        else {

            selectedTags.splice(index, 1);

            button.classList.remove("selected");

        }


        renderCardList();

    }


    /* =================================
       カード一覧
    ================================== */

    function renderCardList() {


        const container =
            document.getElementById("cardList");


        const count =
            document.getElementById("cardCount");


        const search =
            document
                .getElementById("cardSearch")
                .value
                .trim()
                .toLowerCase();


        /* -------------------------
           カード絞り込み
        ------------------------- */

        const filteredCards =
            cards.filter(card => {


                /* 名前検索 */

                const nameMatch =

                    card.name
                        .toLowerCase()
                        .includes(search);


                if (!nameMatch) {

                    return false;

                }


                /* タグが未選択 */

                if (selectedTags.length === 0) {

                    return true;

                }


                /* カードのタグ */

                const cardTags =
                    card.tags || [];


                /* AND */

                if (filterMode === "AND") {

                    return selectedTags.every(
                        tag =>
                            cardTags.includes(tag)
                    );

                }


                /* OR */

                if (filterMode === "OR") {

                    return selectedTags.some(
                        tag =>
                            cardTags.includes(tag)
                    );

                }

            });


        /* 件数 */

        count.textContent =
            `${filteredCards.length} / ${cards.length} 枚`;


        /* クリア */

        container.innerHTML = "";


        /* 結果なし */

        if (filteredCards.length === 0) {

            container.innerHTML =
                '<div class="no-result">' +
                'カードが見つかりません' +
                '</div>';

            return;

        }


        /* -------------------------
           カード表示
        ------------------------- */

        filteredCards.forEach(card => {


            const item =
                document.createElement("div");


            item.className =
                "card-item";


            /* 画像 */

            const img =
                document.createElement("img");


            img.src =
                card.image;


            img.alt =
                card.name;


            /* カード名 */

            const name =
                document.createElement("div");


            name.className =
                "card-name";


            name.textContent =
                card.name;


            /* クリック */

            item.addEventListener(
                "click",
                () => {

                    addCard(card);

                }
            );


            item.appendChild(img);

            item.appendChild(name);


            container.appendChild(item);

        });

    }


    /* =================================
       カード追加
    ================================== */

    function addCard(card) {


        const area =
            document
                .getElementById("registerArea")
                .value;


        cardData[area].push({

            id: card.id,

            name: card.name,

            image: card.image,

            tags: card.tags

        });


        renderCards(area);

    }


    /* =================================
       登録済みカード表示
    ================================== */

    function renderCards(area) {


        const container =
            document.getElementById(area);


        container.innerHTML = "";


        cardData[area].forEach(
            (card, index) => {


                const wrapper =
                    document.createElement("div");


                wrapper.className =
                    "registered-card";


                /* 画像 */

                const img =
                    document.createElement("img");


                img.src =
                    card.image;


                img.alt =
                    card.name;


                img.title =
                    card.name;


                /* 削除 */

                const button =
                    document.createElement("button");


                button.className =
                    "remove";


                button.textContent =
                    "×";


                button.addEventListener(
                    "click",
                    () => {


                        cardData[area]
                            .splice(index, 1);


                        renderCards(area);

                    }
                );


                wrapper.appendChild(img);

                wrapper.appendChild(button);


                container.appendChild(wrapper);

            }
        );

    }


    /* =================================
       検索
    ================================== */

    document
        .getElementById("cardSearch")
        .addEventListener(
            "input",
            () => {

                renderCardList();

            }
        );


    /* =================================
       AND
    ================================== */

    document
        .getElementById("andButton")
        .addEventListener(
            "click",
            () => {


                filterMode = "AND";


                document
                    .getElementById("andButton")
                    .classList.add("active");


                document
                    .getElementById("orButton")
                    .classList.remove("active");


                renderCardList();

            }
        );


    /* =================================
       OR
    ================================== */

    document
        .getElementById("orButton")
        .addEventListener(
            "click",
            () => {


                filterMode = "OR";


                document
                    .getElementById("orButton")
                    .classList.add("active");


                document
                    .getElementById("andButton")
                    .classList.remove("active");


                renderCardList();

            }
        );


    /* =================================
       初期化
    ================================== */

    createTagList();

    renderCardList();


</script>

</html>
